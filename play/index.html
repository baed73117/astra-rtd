<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>아스트라 랜덤타워디펜스</title>
    <!-- 홈페이지용 틀: 창 전체를 게임 화면으로, 고해상도 화면은 최대 2배로 선명하게 -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fdf3dc; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #fdf3dc; touch-action: none; outline: none; }
      #rtd-load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: #5a3a22; background: #fdf3dc; }
      #rtd-load b { font-size: 22px; }
      #rtd-bar { width: min(60vw, 360px); height: 14px; border-radius: 7px; background: #ecd9b6; overflow: hidden; margin-top: 16px; }
      #rtd-fill { height: 100%; width: 0; background: #f06292; transition: width .2s; }
      #rtd-msg { margin-top: 12px; font-size: 14px; color: #8b6a52; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="rtd-load"><b>아스트라 랜덤타워디펜스</b><div id="rtd-bar"><div id="rtd-fill"></div></div><div id="rtd-msg">불러오는 중…</div></div>
    <script src="Build/build_web.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/build_web.data.unityweb",
        frameworkUrl: "Build/build_web.framework.js.unityweb",
        codeUrl: "Build/build_web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "AI Astra",
        productName: "아스트라 랜덤타워디펜스",
        productVersion: "1.1",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, (p) => { document.getElementById("rtd-fill").style.width = (100 * p) + "%"; })
      .then(() => { document.getElementById("rtd-load").style.display = "none"; })
      .catch((m) => { document.getElementById("rtd-msg").textContent = "불러오지 못했어요: " + m; });
    </script>
  </body>
</html>
